onboarding = false
[theme]
name = "vesper"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

status_indicators = "dots"
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+q"
goto = "prefix+g"
new_workspace = "prefix+ctrl+n"
new_tab = "prefix+c"
rename_tab = "prefix+r"
next_tab = "prefix+c"
previous_tab = "prefix+c"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
open_notification_target = "prefix+o"
resize_mode = ""
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
toggle_sidebar = "prefix+ctrl+e"
